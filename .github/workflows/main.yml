name: Build Windows plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset windows-x64

      - name: Build
        run: cmake --build --preset windows-x64 --config Release --parallel

      - name: Install into release folder
        run: cmake --install build_x64 --config Release --prefix "${{ github.workspace }}/release/Release"

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: obs-source-record-times-windows-x64
          path: release/Release
